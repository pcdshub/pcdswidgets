name: Prototype Pixi Testing

# For testing: I'm looking for the best way to deploy our workflows
# Working theory: specifying jobs is better than having a big workflow with many inputs
# Result: we can easily separate workflows by permissions and keep most builds read-only

on:
  push:
  pull_request:
  release:
    types:
      - created

jobs:
  pre-commit:
    name: Pre-commit Checks
    uses: pcdshub/pcds-ci-helpers/.github/workflows/pre-commit.yml@955c97505fc12f3e35afd2aff66130d5e86a9775

  unit-tests:
    permissions:
      contents: read
    uses: pcdshub/pcds-ci-helpers/.github/workflows/python-pixi-test.yml@955c97505fc12f3e35afd2aff66130d5e86a9775

  packaging-tests:
    permissions:
      contents: read
    uses: pcdshub/pcds-ci-helpers/.github/workflows/python-uv-build.yml@955c97505fc12f3e35afd2aff66130d5e86a9775
    with:
      package-name: "pcdswidgets"

  pypi-upload:
    permissions:
      id-token: write
    needs: packaging-tests
    if: github.event_name == 'push' && startsWith(github.event.ref, 'refs/tags')
    uses: pcdshub/pcds-ci-helpers/.github/workflows/python-uv-publish.yml@955c97505fc12f3e35afd2aff66130d5e86a9775

