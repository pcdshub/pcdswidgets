name: Prototype Pixi Testing

# For testing: I'm looking for the best way to deploy our workflows
# Working theory: specifying jobs is better than having a big workflow with many inputs
# Result: we can easily separate workflows by permissions and keep most builds read-only

on:
  push:
    branches:
      - "master"
  pull_request:
  release:
    types:
      - created

jobs:
  pre-commit:
    permissions:
      contents: read
    uses: pcdshub/pcds-ci-helpers/.github/workflows/pre-commit.yml@8ecc78c17d0da6346fa74ed3240850f3df16daee

  unit-tests:
    permissions:
      contents: read
    uses: pcdshub/pcds-ci-helpers/.github/workflows/python-pixi-test.yml@8ecc78c17d0da6346fa74ed3240850f3df16daee

  packaging-tests:
    permissions:
      contents: read
    uses: pcdshub/pcds-ci-helpers/.github/workflows/python-uv-build.yml@8ecc78c17d0da6346fa74ed3240850f3df16daee
    with:
      package-name: "pcdswidgets"

  pypi-upload:
    permissions:
      id-token: write
    needs: packaging-tests
    if: github.event_name == 'push' && startsWith(github.event.ref, 'refs/tags')
    uses: pcdshub/pcds-ci-helpers/.github/workflows/python-uv-publish.yml@8ecc78c17d0da6346fa74ed3240850f3df16daee

